<div class="add-box card border-0 shadow-lg rounded-4 p-4 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Add New User</h4>
        <button class="btn btn-light border rounded-circle" type="button" (click)="close()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>

    <form (ngSubmit)="addUser()" #userForm="ngForm">
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" [(ngModel)]="user.name" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" [(ngModel)]="user.email" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Role</label>
                <select [(ngModel)]="user.role" class="form-select" name="role">
                    <option value="Frontend Developer">Frontend Developer</option>
                    <option value="QA Tester">QA Tester</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="Admin">Admin</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                    <option value="Manager">Manager</option>
                    <option value="Employee">Employee</option>
                    <option value="HR">HR</option>
                    <option value="Team Lead">Team Lead</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Reportee</label>
                <div class="dropdown w-100">
                    <button class="form-select text-start" type="button" data-bs-toggle="dropdown">
                        {{ user.reportee.length ? user.reportee.join(', ') : 'Select Reportee' }}
                    </button>
                    <ul class="dropdown-menu w-100 p-2">
                        <!-- Select all button nu logic  -->
                        <li>
                            <label class="dropdown-item fw-bold">
                                <input type="checkbox" class="form-check-input me-2" [checked]="isAllSelected()"
                                    (change)="toggleSelectAll($event)">
                                Select All
                            </label>
                        </li>
                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        @for (reportee of reporteeList; track reportee) {
                        <li>
                            <label class="dropdown-item">
                                <input type="checkbox" class="form-check-input me-2"
                                    [checked]="user.reportee.includes(reportee)"
                                    (change)="toggleReportee(reportee, $event)">
                                {{ reportee }}
                            </label>
                        </li>
                        }
                    </ul>
                </div>
            </div>

            <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                <button type="button" class="btn btn-light border px-4" (click)="close()">
                    Cancel
                </button>
                <button type="submit" class="btn btn-dark px-4"
                    [disabled]="userForm.invalid || user.reportee.length === 0 || isAdding">
                    Add User
                </button>
            </div>
        </div>
    </form>
</div>
